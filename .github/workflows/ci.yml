name: CI

on:
  push:
    branches:
      - trunk
  pull_request:

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        env:
          MEILI_MASTER_KEY: meilikey
        ports:
          - 7700:7700
        options: --health-cmd "curl --fail http://127.0.0.1:7700/health" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -yqq install imagemagick libpq-dev
      - uses: jdx/mise-action@v4
        with:
          install_args: ruby node pnpm
      - name: Install Ruby dependencies
        run: bundle install
      - name: Setup application
        run: bundle exec rake db:create db:schema:load
        env:
          RAILS_ENV: test
          DB_NAME: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile assets
        run: pnpm run build
        env:
          RAILS_ENV: test
          NODE_ENV: test
      - name: Run tests
        run: bundle exec rspec
        env:
          RAILS_ENV: test
          DB_NAME: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_API_KEY: meilikey
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq-dev
        run: sudo apt-get -yqq install libpq-dev
      - uses: jdx/mise-action@v4
        with:
          install_args: ruby
      - name: Install Ruby dependencies
        run: bundle install
      - name: Run Rubocop
        run: bundle exec rubocop
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm run fmt:check
  assets:
    name: Asset precompile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq-dev
        run: sudo apt-get -yqq install libpq-dev
      - uses: jdx/mise-action@v4
        with:
          install_args: ruby node pnpm
      - run: pnpm install --frozen-lockfile
      - run: bundle install
      - run: bundle exec rails assets:precompile
